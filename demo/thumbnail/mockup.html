<!doctype html>
<html><head><meta charset="utf-8"><title>FunnelTrace thumbnail</title>
<style>
  html, body { margin:0; width:1000px; height:750px; overflow:hidden; }
  body { font-family: "DejaVu Sans", system-ui, sans-serif; color:#fff; position:relative;
    background: radial-gradient(900px 500px at 15% 0%, #3a3fb8 0%, transparent 60%),
                radial-gradient(700px 500px at 100% 100%, #0e7c86 0%, transparent 55%),
                linear-gradient(160deg, #0d1230, #121a3d 60%, #0b1026); }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding-top:26px; }
  h1 { margin:0; font-size:52px; letter-spacing:-1px; }
  .tag { margin:6px 0 0; font-size:19px; color:#c9d0f5; }
  .pills { display:flex; gap:10px; margin-top:16px; }
  .pill { font-size:14px; font-weight:700; padding:7px 14px; border-radius:99px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); }
  .monitor { margin-top:16px; width:700px; background:#1b1f2e; border-radius:14px; padding:12px 12px 14px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 2px #2c3248; }
  .monitor img { display:block; width:676px; height:422.5px; border-radius:6px; }
  .stand { width:110px; height:22px; background:linear-gradient(#2c3248,#1b1f2e); }
  .base { width:230px; height:9px; border-radius:6px; background:#2c3248; }
  .stack { display:flex; gap:8px; margin-top:12px; }
  .stack span { font-size:13px; padding:5px 11px; border-radius:7px; background:rgba(0,0,0,.35); color:#d8defa; }
  .cred { margin-top:10px; font-size:14px; font-weight:700; color:#7ff0b4; background:rgba(71,205,137,.14);
    border:1px solid rgba(71,205,137,.5); padding:6px 14px; border-radius:99px; }
</style></head>
<body><div class="wrap">
  <h1>FunnelTrace</h1>
  <p class="tag">AI lead triage with human approval and a live decision trace</p>
  <div class="pills">
    <span class="pill">Scored with reasoning</span><span class="pill">Cross-channel dedup</span>
    <span class="pill">Approve before send</span><span class="pill">HubSpot sync</span>
  </div>
  <div class="monitor"><img src="shot.png" alt=""></div>
  <div class="stand"></div><div class="base"></div>
  <div class="stack"><span>Python</span><span>FastAPI</span><span>PostgreSQL</span><span>OpenAI</span><span>Next.js</span><span>HubSpot</span></div>
  <div class="cred">Eval: 10/10 category and dedup in every run</div>
</div></body></html>
